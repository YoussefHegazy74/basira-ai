<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="بصيرة منصة عربية هادئة تساعدك على البحث عن المعرفة وفهمها والتحقق من مصادرها."
    />
    <meta name="theme-color" content="#f6f0e6" />

    <title>بصيرة | مساحة عربية للمعرفة والتحقق</title>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("basira.theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)")
            .matches;
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : systemDark
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#26211c" : "#f6f0e6");
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
